<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Охота в замке</title>
<style>
:root{--bg:var(--tg-theme-bg-color,#f6f1e7);--card:var(--tg-theme-secondary-bg-color,#fffaf0);--ink:var(--tg-theme-text-color,#2b2118);--mut:var(--tg-theme-hint-color,#7a6a58);--acc:var(--tg-theme-button-color,#a8321f);--btn:var(--tg-theme-button-text-color,#fff);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:var(--tg-theme-bg-color,#1a1511);--card:var(--tg-theme-secondary-bg-color,#251e18);--ink:var(--tg-theme-text-color,#f1e8d8);--mut:var(--tg-theme-hint-color,#a89883);--acc:var(--tg-theme-button-color,#e0654f)}}
:root[data-theme="dark"]{--bg:var(--tg-theme-bg-color,#1a1511);--card:var(--tg-theme-secondary-bg-color,#251e18);--ink:var(--tg-theme-text-color,#f1e8d8);--mut:var(--tg-theme-hint-color,#a89883);--acc:var(--tg-theme-button-color,#e0654f)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 Georgia,"Times New Roman",serif;display:flex;justify-content:center}
main{width:100%;max-width:420px;padding:14px;display:flex;flex-direction:column}
h1{margin:0;font-size:24px;text-align:center}
.bar{display:flex;justify-content:space-between;margin:10px 0;font-size:18px}
.bar span b{color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hole{aspect-ratio:1;background:var(--card);border-radius:16px;border:0;font-size:44px;display:flex;align-items:center;justify-content:center;color:var(--ink);transition:transform .08s}
.hole:active{transform:scale(.94)}
.hole.pop{animation:p .15s ease-out}
@keyframes p{from{transform:scale(.4)}to{transform:scale(1)}}
.lv{display:flex;gap:6px;margin-bottom:10px}.lv button{flex:1;padding:9px 4px;border:1px solid var(--mut);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:15px}.lv button.on{background:var(--acc);border-color:var(--acc);color:var(--btn)}.lv button:disabled{opacity:.6}
.go{margin-top:14px;background:var(--acc);color:var(--btn);border:0;border-radius:12px;padding:14px;font:inherit;font-size:18px}
.ext{background:transparent;color:var(--acc);border:2px solid var(--acc);margin-top:10px}[hidden]{display:none!important}
.msg{text-align:center;color:var(--mut);font-size:14px;margin:10px 0 0;min-height:40px}
</style>
</head>
<body>
<main>
<h1>🏰 Охота в замке</h1>
<div class="lv" id="lv"></div>
<div class="bar"><span>Очки: <b id="s">0</b></span><span>Время: <b id="t">30</b></span><span>Рекорд: <b id="b">0</b></span></div>
<div class="grid" id="g"></div>
<button class="go" id="go">Начать</button>
<button class="go ext" id="ext" hidden>▶ +10 секунд за рекламу</button>
<p class="msg" id="m">Бейте 👹 (+1) и 👑 (+5). Не трогайте 💣 (−3)!</p>
</main>
<script>
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand()}catch(e){}}
const buzz=t=>{try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred(t)}catch(e){}};
const $=id=>document.getElementById(id);
const LV=[{n:"Лёгко",sp:800,vis:1200,bomb:.1,crown:.12,x:1},{n:"Нормально",sp:600,vis:900,bomb:.18,crown:.12,x:1},{n:"Сложно",sp:420,vis:650,bomb:.28,crown:.1,x:2}];let lv=1;const KEY=()=>"castle-hunt-best-"+lv;
let best=0;const loadBest=()=>{best=0;try{best=+localStorage.getItem(KEY())||0}catch(e){}$("b").textContent=best};
const holes=[];
for(let i=0;i<9;i++){const h=document.createElement("button");h.className="hole";h.onclick=()=>hit(i);$("g").appendChild(h);holes.push(h)}
let score=0,left=30,run=false,cur=[],tick,spawn,used=false,offering=false;
let TYPES=[];const setTypes=()=>{const L=LV[lv];TYPES=[["👹",1,1-L.crown-L.bomb],["👑",5,L.crown],["💣",-3,L.bomb]]};
function pick(){const r=Math.random();let a=0;for(const t of TYPES){a+=t[2];if(r<a)return t}return TYPES[0]}
function clearHole(i){holes[i].textContent="";cur[i]=null}
function show(){
  if(!run)return;
  const free=holes.map((_,i)=>i).filter(i=>!cur[i]);
  if(!free.length)return;
  const i=free[Math.floor(Math.random()*free.length)],t=pick();
  cur[i]=t;holes[i].textContent=t[0];holes[i].classList.remove("pop");void holes[i].offsetWidth;holes[i].classList.add("pop");
  setTimeout(()=>{if(cur[i]===t)clearHole(i)},LV[lv].vis);
}
function hit(i){
  if(!run||!cur[i])return;
  score=Math.max(0,score+cur[i][1]*(cur[i][1]>0?LV[lv].x:1));
  buzz(cur[i][1]<0?"heavy":"light");
  $("s").textContent=score;clearHole(i);
}
function end(){
  run=false;clearInterval(tick);clearInterval(spawn);holes.forEach((_,i)=>clearHole(i));
  if(used){finish();return}
  offering=true;$("ext").hidden=false;$("go").disabled=false;$("go").textContent="Завершить";
  $("m").textContent=`Время вышло! У вас ${score} очк. Продлить на 10 секунд за просмотр рекламы?`;
}
function finish(){
  offering=false;$("ext").hidden=true;
  run=false;clearInterval(tick);clearInterval(spawn);holes.forEach((_,i)=>clearHole(i));
  let txt=`Игра окончена: ${score} очк.`;
  if(score>best){best=score;$("b").textContent=best;txt+=" Новый рекорд! 🎉";try{localStorage.setItem(KEY(),best)}catch(e){}}
  $("m").textContent=txt;$("go").textContent="Играть снова";lvBtns(true);$("go").disabled=false;
  try{tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred("success")}catch(e){}
}
/* === РЕКЛАМА ===
   Сейчас стоит демо-режим (3 секунды-заглушка).
   Для настоящей рекламы AdsGram: provider:"adsgram", blockId — из кабинета сети.
   Работает только когда игра размещена на вашем HTTPS-хостинге. */
const AD_CONFIG={provider:"demo",blockId:""};
const loadScript=src=>new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
async function showRewardedAd(){
  if(AD_CONFIG.provider==="adsgram"&&AD_CONFIG.blockId){
    try{
      if(!window.Adsgram)await loadScript("https://sad.adsgram.ai/js/sad.min.js");
      const r=await window.Adsgram.init({blockId:AD_CONFIG.blockId}).show();
      return !!(r&&r.done);
    }catch(e){return false}
  }
  return new Promise(ok=>{let n=3;$("m").textContent="Демо-реклама… "+n;const id=setInterval(()=>{n--;if(n<=0){clearInterval(id);ok(true)}else $("m").textContent="Демо-реклама… "+n},1000)});
}
$("ext").onclick=async()=>{
  $("ext").disabled=true;$("go").disabled=true;
  const ok=await showRewardedAd();
  $("ext").disabled=false;$("go").disabled=false;
  if(!ok){$("m").textContent="Реклама не показалась — награда не начислена.";return}
  used=true;offering=false;$("ext").hidden=true;left=10;run=true;
  $("t").textContent=left;$("m").textContent="";$("go").disabled=true;$("go").textContent="Идёт охота…";
  tick=setInterval(()=>{left--;$("t").textContent=left;if(left<=0)end()},1000);
  spawn=setInterval(show,LV[lv].sp);show();
};
const lvBtns=on=>document.querySelectorAll("#lv button").forEach(b=>b.disabled=!on);
LV.forEach((l,i)=>{const b=document.createElement("button");b.textContent=l.n;b.onclick=()=>{lv=i;document.querySelectorAll("#lv button").forEach((x,j)=>x.classList.toggle("on",j===i));loadBest();$("m").textContent=i===2?"Сложно: очки за 👹 и 👑 ×2, больше бомб, монстры быстрее.":i===0?"Лёгко: монстры медленнее, бомб меньше.":""};$("lv").appendChild(b)});
document.querySelectorAll("#lv button")[1].classList.add("on");loadBest();
$("go").onclick=()=>{
  if(offering){finish();return}
  score=0;left=30;run=true;cur=[];setTypes();lvBtns(false);used=false;offering=false;$("ext").hidden=true;
  $("s").textContent=0;$("t").textContent=30;$("m").textContent="";$("go").disabled=true;$("go").textContent="Идёт охота…";
  tick=setInterval(()=>{left--;$("t").textContent=left;if(left<=0)end()},1000);
  spawn=setInterval(show,LV[lv].sp);show();
};
</script>
</body>
</html>
